[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "native-replay-vllm"
version = "0.1.0"
description = "Post-sampling forced-token extension for native agent replay"
requires-python = ">=3.11"

[project.entry-points."vllm.logits_processors"]
native_replay_forced = "native_replay_vllm.forced:ForcedSequenceProcessor"

[tool.setuptools.packages.find]
where = ["src"]
