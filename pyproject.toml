[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "minireplayer"
version = "0.1.0"
description = "Sweep-derived agent workload replayer"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "aiohttp>=3.11,<4",
  "matplotlib>=3.9,<4",
  "psutil>=6,<8",
  "pyyaml>=6,<7",
]

[project.scripts]
minireplay = "minireplay.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-timeout>=2.4.0",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["minireplay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
